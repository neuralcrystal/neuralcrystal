[project]
name = "neuralcrystal"
version = "0.1.0"
description = "Run trained NeuralCrystal crystals: the light path through a glass block of phase surfaces, in PyTorch"
requires-python = ">=3.9"
dependencies = ["numpy", "torch"]
license = { text = "MIT" }
readme = "README.md"

[project.optional-dependencies]
examples = ["pillow"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["neuralcrystal"]
